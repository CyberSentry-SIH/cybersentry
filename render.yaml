services:
  # -------------------------------------------------------------
  # Backend API Web Service
  # -------------------------------------------------------------
  - type: web
    name: cybersentry-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cybersentry-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ENABLE_PII_MASKING
        value: "true"
      - key: ENABLE_LLM
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: EVIDENCE_STORAGE_PATH
        value: /tmp/evidence_store

  # -------------------------------------------------------------
  # Frontend Next.js Web Service
  # -------------------------------------------------------------
  - type: web
    name: cybersentry-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: cybersentry-backend
          property: host
          value: https://${host}/api/v1
      - key: NODE_ENV
        value: production

# -------------------------------------------------------------
# Managed PostgreSQL Database
# -------------------------------------------------------------
databases:
  - name: cybersentry-db
    plan: free
    region: oregon
    databaseName: cybersentry
    user: cybersentry
