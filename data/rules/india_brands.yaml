# India-specific brand profiles for lookalike and impersonation detection (F14)
brands:
  - id: "sbi"
    name: "State Bank of India"
    official_domains:
      - "sbi.co.in"
      - "onlinesbi.sbi"
      - "onlinesbi.com"
